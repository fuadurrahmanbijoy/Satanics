<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
const S={bytes:null,doc:null,pj:null,N:0,bg:[255,255,255],name:''};
const C={lay:'two',k:6,left:'small',edge:'side',rev:0,rot:0,mode:'color',mg:0,fold:1,tag:1};
try{Object.assign(C,JSON.parse(localStorage.getItem('eth-c')||'{}'));const t=localStorage.getItem('eth-t');if(t)document.documentElement.dataset.theme=t}catch(e){}
let A={k:'',d:{}};try{A=JSON.parse(localStorage.getItem('eth-a'))||A}catch(e){}
const sv=()=>{try{localStorage.setItem('eth-c',JSON.stringify(C))}catch(e){}},svA=()=>{try{localStorage.setItem('eth-a',JSON.stringify(A))}catch(e){}};
let view='prep',pi=0,sgSel=-1;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
/* ---- imposition (theory: front P-2i | 1+2i, back 2+2i | P-1-2i) ---- */
const SP=(c=C)=>c.lay==='two'?4:2;
function plan(N,c=C){const sh=Math.ceil(N/SP(c)),k=Math.max(1,c.k),z=[];if(!sh)return z;const f=Math.floor(sh/k),r=sh%k;for(let i=0;i<f;i++)z.push(k);if(r){if(c.left==='merge'&&f)z[f-1]+=r;else z.push(c.left==='pad'?k:r)}return z}
function sheets(z,c=C){const o=[];let b=0;z.forEach((k,s)=>{if(c.lay==='two'){const P=4*k;for(let i=0;i<k;i++)o.push({s,i,f:[b+P-2*i-1,b+2*i],b:[b+2*i+1,b+P-2*i-2]});b+=P}else{for(let i=0;i<k;i++)o.push({s,i,f:[b+2*i],b:[b+2*i+1]});b+=2*k}});return o}
function selfTest(){const sv0={...C};let ok=true;for(const lay of['two','fold'])for(const left of['small','merge','pad'])for(let k=1;k<=8;k++)for(let N=1;N<=70;N+=2){Object.assign(C,{lay,left,k});const seen=sheets(plan(N)).flatMap(x=>[...x.f,...x.b]).filter(n=>n<N).sort((a,b)=>a-b);if(seen.length!==N||seen.some((n,i)=>n!==i))ok=false}
Object.assign(C,sv0);const t=sheets([1])[0];C.lay='two';const a=sheets([1])[0];Object.assign(C,sv0);return ok&&a.f.join()==='3,0'&&a.b.join()==='1,2'}
/* ---- PDF build ---- */
async function build(side,o={}){const {PDFDocument,rgb,degrees,StandardFonts}=PDFLib,two=C.lay==='two',W=two?841.89:595.28,H=two?595.28:841.89,hw=two?W/2:W,keep={...C};
if(o.test)Object.assign(C,{k:2,left:'small'});
try{const N=o.test?8:S.N,z=plan(N),all=sheets(z).filter(x=>o.only==null||x.s===o.only),bg=C.mode==='color'?rgb(...S.bg.map(v=>v/255)):rgb(1,1,1),d=await PDFDocument.create(),fnt=await d.embedFont(StandardFonts.HelveticaBold),emb=[];
if(!o.test){const need=[...new Set(all.flatMap(x=>[...x.f,...x.b]).filter(n=>n<N))].sort((a,b)=>a-b);(await d.embedPdf(S.doc||(S.doc=await PDFDocument.load(S.bytes,{ignoreEncryption:true})),need)).forEach((e,i)=>emb[need[i]]=e)}
let list=side==='x'?all.flatMap(s=>[[s,'f'],[s,'b']]):all.map(s=>[s,side]);if(C.rev&&side==='b')list.reverse();
const m=C.mg*2.835,pink=rgb(.76,.09,.36),gray=rgb(.45,.45,.45),erot=!!C.rot;
for(const[s,sd]of list){const p=d.addPage([W,H]);p.drawRectangle({x:0,y:0,width:W,height:H,color:bg});
s[sd].forEach((n,j)=>{if(n>=N)return;const x0=j*hw;
if(o.test){p.drawRectangle({x:x0+20,y:20,width:hw-40,height:H-40,borderWidth:2,borderColor:pink});const t=String(n+1);p.drawText(t,{x:x0+hw/2-fnt.widthOfTextAtSize(t,two?150:200)/2,y:H/2-50,size:two?150:200,font:fnt,color:pink});p.drawText((sd==='f'?'FRONT':'BACK')+'  ^ TOP',{x:x0+40,y:H-60,size:18,font:fnt,color:gray})}
else{const e=emb[n],sc=Math.min((hw-2*m)/e.width,(H-2*m)/e.height),w=e.width*sc,h=e.height*sc;p.drawPage(e,{x:x0+(hw-w)/2,y:(H-h)/2,xScale:sc,yScale:sc})}});
if(C.fold&&C.lay!=='flat')p.drawLine(two?{start:{x:W/2,y:0},end:{x:W/2,y:H},thickness:.4,color:gray,dashArray:[3,5]}:{start:{x:0,y:H/2},end:{x:W,y:H/2},thickness:.4,color:gray,dashArray:[3,5]});
if(C.tag){const t=`S${s.s+1}  ${s.i+1}/${z[s.s]}  ${sd==='f'?'F':'B'}`;p.drawText(t,{x:W/2-fnt.widthOfTextAtSize(t,6)/2,y:5,size:6,font:fnt,color:gray})}
if(sd==='b'&&erot)p.setRotation(degrees(180))}
return await d.save()}finally{Object.assign(C,keep)}}
async function out(nm,u8){const cl=window.claude&&await claude.use('downloads');if(cl)await cl.save({filename:nm,data:u8});else{const a=document.createElement('a');a.href=URL.createObjectURL(u8 instanceof Blob?u8:new Blob([u8],{type:'application/pdf'}));a.download=nm;a.click()}}
const slug=()=>(S.name||'Book').replace(/\.pdf$/i,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'Book';
const pad=(i,n)=>String(i).padStart(Math.max(2,String(n).length),'0'),SD={f:'Front',b:'Back',x:'Duplex'};
async function dl(side,o={}){try{toast('Building PDF…');const u8=await build(side,o),n=plan(S.N).length,nm=o.test?`Ethene_Test_${SD[side]}.pdf`:o.only!=null?`Ethene_${slug()}_Sig-${pad(o.only+1,n)}_${SD[side]}.pdf`:`Ethene_${slug()}_${SD[side]}.pdf`;await out(nm,u8);toast('Ready: '+nm)}catch(e){console.error(e);toast('Not saved')}}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(fs){const en=new TextEncoder(),parts=[],cen=[];let off=0;for(const f of fs){const n=en.encode(f.name),c=crc(f.data),z=f.data.length,h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,z,true);h.setUint32(22,z,true);h.setUint16(26,n.length,true);parts.push(new Uint8Array(h.buffer),n,f.data);const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint32(16,c,true);d.setUint32(20,z,true);d.setUint32(24,z,true);d.setUint16(28,n.length,true);d.setUint32(42,off,true);cen.push(new Uint8Array(d.buffer),n);off+=30+n.length+z}
const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,fs.length,true);e.setUint16(10,fs.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
async function dlZip(){try{const n=plan(S.N).length,fs=[];for(let i=0;i<n;i++){toast(`Building signature ${i+1} of ${n}…`);for(const s of['f','b'])fs.push({name:`Signature-${pad(i+1,n)}_${SD[s]}.pdf`,data:await build(s,{only:i})});await new Promise(r=>setTimeout(r,20))}const nm=`Ethene_${slug()}_Signatures.zip`;await out(nm,zip(fs));toast('Ready: '+nm)}catch(e){console.error(e);toast('Not saved')}}
/* ---- controls + tooltips ---- */
const R=(x,y,w,h,t,o={})=>`<g${o.r?` transform="rotate(${o.r} ${x+w/2} ${y+h/2})"`:''}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${o.f||'var(--hi)'}" stroke="var(--acc)" stroke-opacity=".6"/>${t!=null?`<text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="${o.s||13}" font-weight="600" fill="var(--acc)">${t}</text>`:''}</g>`;
const T=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="9.5" fill="var(--mut)">${t}</text>`,AR=d=>`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/>`,DL=(a,b,c,d)=>`<path class="dash" d="M${a} ${b}L${c} ${d}" stroke="var(--acc)" stroke-width="1.3" fill="none"/>`;
const SV=s=>`<svg viewBox="0 0 240 130"><defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4 0 8z" fill="var(--acc)"/></marker></defs>${s}</svg>`;
const SGD=(a,p)=>{let x=10,o='';a.forEach((c,j)=>{const w=c*8;o+=R(x,20,w,56,c)+(j==a.length-1&&p?`<rect x="${x+w}" y="20" width="${p*8}" height="56" rx="3" fill="var(--ln)"/>${T(x+w+p*4,52,'blank')}`:'')+T(x+w/2,92,'Sig '+(j+1));x+=w+(j==a.length-1&&p?p*8:0)+10});return o+T(120,118,'16 sheets, 6 per signature')};
const PAIR=r=>[1,2,3].map((n,j)=>R(24,8+j*38,56,28,'F'+n,{s:12})+AR(`M86 ${22+j*38}H112`)+R(120,8+j*38,56,28,'B'+(r?4-n:n),{s:12})).join('')+T(205,64,r?'Reversed':'Same');
const FL=h=>R(20,18,64,90,'A')+(h?DL(10,63,94,63)+AR('M96 26Q112 63 96 100'):DL(52,10,52,120)+AR('M26 14Q52 2 78 14'))+AR('M112 62H130')+R(138,18,64,90,'A')+T(170,122,'Back reads upright');
const RT=r=>R(24,14,64,92,'A')+T(56,120,'As saved')+AR('M96 60H122')+R(132,14,64,92,'A',{r:r?180:0})+T(164,120,r?'Upside-down':'Upright');
const H={
'lay:two':['Layout','2-up (standard)','Two book pages sit side by side on each A4 landscape side, so one sheet carries 4 pages. Sheets are nested and folded in half.',['You fold sheets in half to make a booklet','You want the accepted signature method'],['Your pages should print one per side'],'Sheet = 2 sides × 2 pages. One sheet: front 4 | 1, back 2 | 3.',()=>SV(R(8,16,44,60,'4')+R(52,16,44,60,'1')+T(52,90,'Front')+AR('M102 46H120')+R(126,16,44,60,'2')+R(170,16,44,60,'3')+T(170,90,'Back')+T(120,116,'Page 2 sits behind 1, page 3 behind 4'))],
'lay:fold':['Layout','1-up folded','One page per A4 portrait side. Every sheet is folded in half on its own, along a dashed line.',['You want single folded leaves','You print one page per side'],['You want nested signatures'],'Sheet = 2 pages. Dashed line = fold.',()=>SV(R(14,8,70,104,'1')+DL(14,60,84,60)+T(49,124,'Fold line')+AR('M94 60H120')+R(130,38,80,44,'1 | 2',{s:12})+T(170,98,'Folded leaf'))],
'lay:flat':['Layout','1-up flat','One page per A4 portrait side. Sheets stay flat and are stacked in order, with no folding.',['You bind loose sheets','You do not fold anything'],['You want folded signatures'],'Sheet = 2 pages. No fold, no nesting.',()=>SV(R(14,8,62,104,'1')+AR('M82 60H100')+R(106,8,62,104,'2')+R(186,34,40,60)+R(192,28,40,60)+R(198,22,40,60,'1–2',{s:10})+T(212,112,'Stack'))],
'per':['Signature','Sheets per signature','How many sheets are nested and folded together. Each sheet adds 4 pages in 2-up, or 2 in 1-up. Type any number from 1 to 30.',['You know how thick a stack folds cleanly','You want fewer, thicker signatures'],['You plan by page count: divide pages by 4'],()=>{const k=HC.k,P=k*SP(HC);return `${k} sheets = ${P} pages. Outer sheet: front ${P} | 1, back 2 | ${P-1}.`},()=>{const k=Math.max(1,HC.k);return SV([...Array(Math.min(k,8)).keys()].map(j=>R(18+j*5,14+j*4,64,70)).join('')+T(52,112,'Nested and folded')+`<text x="158" y="62" text-anchor="middle" font-size="28" font-weight="600" fill="var(--acc)">${k}</text>`+T(158,82,'sheets')+T(158,98,'= '+k*SP(HC)+' pages'))}],
'left:small':['Leftovers','Smaller last signature','The last signature holds only the sheets that remain.',['You accept one thinner signature','You want no wasted paper'],['Every signature must match'],'16 sheets, 6 per signature: 6, 6, 4.',()=>SV(SGD([6,6,4]))],
'left:merge':['Leftovers','Merge into previous','Remaining sheets join the previous signature, which becomes thicker.',['You dislike thin signatures','A thicker one still folds well'],['Every signature must match'],'16 sheets, 6 per signature: 6, 10.',()=>SV(SGD([6,10]))],
'left:pad':['Leftovers','Pad to full signature','Blank pages complete the last signature so all signatures are identical.',['Every signature must be identical'],['You want to save paper'],'16 sheets, 6 per signature: 6, 6, 6 (2 blank sheets at the end).',()=>SV(SGD([6,6,4],2))],
'edge:side':['Printer','Flip like a book','The pile turns around the vertical edge, like a book cover. Left and right swap and the top stays on top. No rotation needed.',['You re-insert the pile like turning a page','This is the default'],['You turn it over the top edge'],'Back pages are drawn upright (WYSIWYG).',()=>SV(FL(0))],
